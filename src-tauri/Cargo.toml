[package]
name = "navinamp"
version.workspace = true
edition.workspace = true
description = "NaVinaMP — a Winamp3-style desktop music player"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "navinamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
navinamp-audio = { path = "../crates/navinamp-audio" }
navinamp-library = { path = "../crates/navinamp-library" }
navinamp-llm = { path = "../crates/navinamp-llm" }
navinamp-subsonic = { path = "../crates/navinamp-subsonic" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
# The default features select notify-rust's macOS backend
# (NSUserNotificationCenter): deprecated, but it delivers from unbundled
# `tauri dev` runs and non-notarized builds — notify-rust's
# `preview-macos-un` (UNUserNotificationCenter) needs a bundled, authorized
# app. Toasts are attributed to the running binary in dev; bundled builds
# pick up the bundle id.
notify-rust = { version = "4.18", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "query"] }
navinamp-skin = { path = "../crates/navinamp-skin" }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
