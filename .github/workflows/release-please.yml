name: release-please

# Semantic releases: conventional commits on master (feat/fix/feat!-BREAKING)
# drive the next version. This job maintains CHANGELOG.md and opens/updates a
# Release PR; merging it tags vX.Y.Z and creates the GitHub release.
#
# The tag does NOT start CI's release jobs (see the token note below). Run
# the CI workflow on the tag instead (Actions → CI → Run workflow, then pick
# the tag): it attaches the installers to the release release-please created.
# Prefer that over deleting and re-pushing the tag. A re-pushed tag can
# detach the GitHub release from it and leave it as an untagged draft; if
# that happens, re-publish it with
# `gh release edit vX.Y.Z --draft=false --tag vX.Y.Z`.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Optional: a classic PAT (repo scope) stored as secret
          # RELEASE_PLEASE_TOKEN. Tags/releases created with GITHUB_TOKEN do
          # NOT trigger `push: tags` workflows — with a PAT they do, making
          # the release installers fully automatic. Without it, run the CI
          # workflow on the tag (see the note at the top of this file).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
