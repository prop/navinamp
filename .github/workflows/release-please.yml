name: release-please

# Semantic releases: conventional commits on master (feat/fix/feat!-BREAKING)
# drive the next version. This job maintains CHANGELOG.md and opens/updates a
# Release PR; merging it tags vX.Y.Z — which triggers the CI release job
# (tests -> Mac mini build -> dmg attached to the GitHub Release).

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Optional: a classic PAT (repo scope) stored as secret
          # RELEASE_PLEASE_TOKEN. Tags/releases created with GITHUB_TOKEN do
          # NOT trigger `push: tags` workflows — with a PAT they do, making
          # the release dmg fully automatic. Without it, push the tag from
          # a local checkout: `git push origin vX.Y.Z`.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
