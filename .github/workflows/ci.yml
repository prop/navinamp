name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (ubuntu)
    # Pinned: ubuntu-latest moved to Ubuntu 26 (2026-10-19) whose package set
    # breaks Tauri's system deps; stay on 24.04 until they're verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          # NB: the default shell is `bash -e`; drop errexit around the
          # pipeline so the failure path below actually runs.
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the log tail as annotations (publicly readable via
            # the API — logs require sign-in). Whatever stopped the build,
            # its last words end up here.
            grep -v '^\s*$' /tmp/clippy.log | tail -10 | while IFS= read -r line; do
              echo "::error::${line:0:220}"
            done
          fi
          exit "$status"

      - name: tests
        run: cargo test --workspace

  # NB: no per-push mac build job — a one-slot self-hosted runner backlogs
  # under rapid pushes, and the `release` job already builds the dmg on v*
  # tags (the public download path). Re-add a manual `workflow_dispatch`
  # build here if per-push artifacts are ever needed.

  release:
    name: Release (Mac mini)
    # Tag pushes (v*) only: publish the dmg as a GitHub Release asset.
    # Self-hosted runner — never runs for fork pull requests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare App Store Connect API key (if configured)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$HOME/.navinamp-signing"
            printf '%s' "$APPLE_API_KEY_P8" > "$HOME/.navinamp-signing/AuthKey_NaVinaMP.p8"
            echo "APPLE_API_KEY_PATH=$HOME/.navinamp-signing/AuthKey_NaVinaMP.p8" >> "$GITHUB_ENV"
          else
            echo "no notarization key configured — build stays ad-hoc signed"
          fi

      - name: Set version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "building version $VER"
          npm version "$VER" --no-git-tag-version
          sed -i '' "s/^version = \".*\"/version = \"$VER\"/" Cargo.toml
          grep -q "^version = \"$VER\"" Cargo.toml || { echo "version stamp failed"; exit 1; }
          # sync Cargo.lock member versions (no dependency upgrades)
          cargo metadata --format-version 1 > /dev/null

      - name: Build release bundle
        env:
          # When these secrets exist, the Tauri CLI signs (Developer ID),
          # notarizes and staples automatically. Without them the build is
          # ad-hoc signed (Gatekeeper prompts on other machines).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          # Alternative simpler notarization path (choose either):
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        # APP only: Tauri's dmg step drives Finder via AppleScript, which
        # times out on this headless launchd runner (AppleEvent -1712).
        run: npm ci && npm run tauri build -- --bundles app

      - name: Package dmg (headless-safe hdiutil)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p target/release/bundle/dmg
          hdiutil create \
            -volname "NaVinaMP" \
            -srcfolder "target/release/bundle/macos/NaVinaMP.app" \
            -ov -format UDZO \
            "target/release/bundle/dmg/NaVinaMP_${VER}_x64.dmg"

      - name: Publish GitHub Release (dmg)
        uses: softprops/action-gh-release@v2
        with:
          # dmg only — no zip, per project decision.
          files: target/release/bundle/dmg/*.dmg
          generate_release_notes: true
