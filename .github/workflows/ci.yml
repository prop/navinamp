name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (ubuntu)
    # Pinned: ubuntu-latest moved to Ubuntu 26 (2026-10-19) whose package set
    # breaks Tauri's system deps; stay on 24.04 until they're verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Prefer the upstream Ubuntu archive
        # The ubuntu-24.04 image routes apt through
        # mirror+file:/etc/apt/apt-mirrors.txt, which can point at an
        # unreachable azure.archive.ubuntu.com host (blocking installs with
        # "Unable to connect"). Rewrite that host to the upstream archive.
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            sudo sed -i \
              -e 's|https\?://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' \
              "$f" || true
          done

      - name: Install Tauri Linux dependencies
        # Mirror hiccups have left this step hanging for 40+ minutes. Bound
        # it and let apt retry, so a bad runner fails fast and can be rerun
        # instead of blocking the whole workflow.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          # NB: the default shell is `bash -e`; drop errexit around the
          # pipeline so the failure path below actually runs.
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the log tail as annotations (publicly readable via
            # the API — logs require sign-in). Whatever stopped the build,
            # its last words end up here.
            grep -v '^\s*$' /tmp/clippy.log | tail -10 | while IFS= read -r line; do
              echo "::error::${line:0:220}"
            done
          fi
          exit "$status"

      - name: tests
        run: cargo test --workspace

  # NB: no per-push mac build job — a one-slot self-hosted runner backlogs
  # under rapid pushes, and the `release` job already builds the dmg on v*
  # tags (the public download path). Re-add a manual `workflow_dispatch`
  # build here if per-push artifacts are ever needed.

  # One idempotent creator so the three parallel platform builds can upload
  # assets to the same release without racing to create it.
  release-create:
    name: Release (create)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes

  release:
    name: Release (Mac mini)
    # Tag pushes (v*) only: publish the dmg as a GitHub Release asset.
    # Self-hosted runner — never runs for fork pull requests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release-create]
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A cold tauri release build on the 8 GB mac mini takes ~60 minutes and
      # starves the runner (GitHub cancels after ~11 min of missed heartbeats).
      # Cache the release target so tag builds are incremental.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Prepare App Store Connect API key (if configured)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$HOME/.navinamp-signing"
            printf '%s' "$APPLE_API_KEY_P8" > "$HOME/.navinamp-signing/AuthKey_NaVinaMP.p8"
            echo "APPLE_API_KEY_PATH=$HOME/.navinamp-signing/AuthKey_NaVinaMP.p8" >> "$GITHUB_ENV"
          else
            echo "no notarization key configured — build stays ad-hoc signed"
          fi

      - name: Prepare signing environment (if configured)
        # Empty-string secrets must NOT reach the Tauri CLI: it treats
        # APPLE_CERTIFICATE="" as "signing configured" and dies importing
        # an empty PKCS#12. Only non-empty values go into the environment
        # (heredoc form so the multiline base64 cert survives).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          append() {
            local key="$1" val="$2"
            # Multiline values (the base64 cert may be wrapped) need the
            # heredoc form of GITHUB_ENV; single-line values the plain one.
            # (No literal newlines in this script — the block scalar in the
            # workflow YAML would otherwise be terminated by one.)
            if [ -n "$val" ] && [ "${val#*$'\n'}" != "$val" ]; then
              echo "${key}<<VAL_EOF" >> "$GITHUB_ENV"
              printf '%s\n' "$val" >> "$GITHUB_ENV"
              echo "VAL_EOF" >> "$GITHUB_ENV"
            elif [ -n "$val" ]; then
              echo "${key}=${val}" >> "$GITHUB_ENV"
            fi
          }
          append APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          append APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          append APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          append APPLE_ID "$APPLE_ID"
          append APPLE_PASSWORD "$APPLE_PASSWORD"
          # App Store Connect API key trio (alternative notarization path):
          append APPLE_API_ISSUER "$APPLE_API_ISSUER"
          append APPLE_API_KEY "$APPLE_API_KEY_ID"
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "no signing identity configured — build stays ad-hoc signed"
          fi

      - uses: ./.github/actions/stamp-version

      - name: Build release bundle
        # APP only: Tauri's dmg step drives Finder via AppleScript, which
        # times out on this headless launchd runner (AppleEvent -1712).
        # Signing/notarization env vars arrive via GITHUB_ENV from the
        # prepare step above — only non-empty values are exported.
        # Two jobs keeps the 2-core/8 GB mini responsive enough for the
        # runner's heartbeat while rustc works (4 parallel jobs starve it).
        env:
          CARGO_BUILD_JOBS: 2
        run: npm ci && npm run tauri build -- --bundles app

      - name: Package dmg (headless-safe hdiutil)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGING="target/release/bundle/dmg/NaVinaMP_${VER}"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "target/release/bundle/macos/NaVinaMP.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "NaVinaMP" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "target/release/bundle/dmg/NaVinaMP_${VER}_x64.dmg"

      - name: Publish GitHub Release (dmg)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dmg only — no zip, per project decision.
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg --clobber

  release-linux:
    name: Release (Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release-create]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Prefer the upstream Ubuntu archive
        # The ubuntu-24.04 image routes apt through
        # mirror+file:/etc/apt/apt-mirrors.txt, which can point at an
        # unreachable azure.archive.ubuntu.com host (blocking installs with
        # "Unable to connect"). Rewrite that host to the upstream archive.
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            sudo sed -i \
              -e 's|https\?://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' \
              "$f" || true
          done

      - name: Install Tauri Linux dependencies
        # Mirror hiccups have left this step hanging for 40+ minutes. Bound
        # it and let apt retry, so a bad runner fails fast and can be rerun
        # instead of blocking the whole workflow.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf
          # AppImage tooling (linuxdeploy/appimagetool are AppImages): FUSE is
          # absent on GitHub runners, so the tools extract-and-run; the package
          # name differs across Ubuntu releases.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/stamp-version

      - name: Build release bundle
        run: npm ci && npm run tauri build -- --bundles deb,rpm,appimage

      - name: Publish GitHub Release (Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail fast (and legibly) if a bundler produced an unexpected path
          # instead of letting `gh` fail after the compile.
          for f in target/release/bundle/deb/*.deb \
                   target/release/bundle/rpm/*.rpm \
                   target/release/bundle/appimage/*.AppImage; do
            [ -e "$f" ] || { echo "missing expected artifact: $f"; exit 1; }
          done
          gh release upload "$GITHUB_REF_NAME" \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage \
            --clobber

  release-windows:
    name: Release (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release-create]
    runs-on: windows-latest
    permissions:
      contents: write
    # Git Bash: `sed`/`grep`/`gh` behave like the other jobs; the default
    # PowerShell would need different quoting for the same version stamp.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri downloads WiX (msi) and NSIS (setup.exe) itself on first use.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/stamp-version

      - name: Build release bundle
        run: npm ci && npm run tauri build -- --bundles msi,nsis

      - name: Publish GitHub Release (Windows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail fast (and legibly) if a bundler produced an unexpected path
          # instead of letting `gh` fail after the compile.
          for f in target/release/bundle/msi/*.msi \
                   target/release/bundle/nsis/*-setup.exe; do
            [ -e "$f" ] || { echo "missing expected artifact: $f"; exit 1; }
          done
          gh release upload "$GITHUB_REF_NAME" \
            target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*-setup.exe \
            --clobber

  release-verify:
    name: Release (verify assets)
    # release-please creates the release (non-draft) before the tag workflow
    # runs, so partial releases cannot be prevented by draft gymnastics — this
    # job is the single signal that every platform actually shipped.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, release-linux, release-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: All three platforms published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$assets"
          fail=0
          for ext in dmg deb rpm AppImage msi exe; do
            printf '%s\n' "$assets" | grep -q "\.${ext}$" \
              || { echo "::error::release is missing a .${ext} artifact"; fail=1; }
          done
          exit "$fail"
