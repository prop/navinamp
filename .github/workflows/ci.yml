name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (ubuntu)
    # Pinned: ubuntu-latest moved to Ubuntu 26 (2026-10-19) whose package set
    # breaks Tauri's system deps; stay on 24.04 until they're verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the actual errors as annotations (publicly readable
            # via the API — logs require sign-in).
            grep -E "^error(\[|:)" /tmp/clippy.log | head -8 | while IFS= read -r line; do
              echo "::error::${line:0:220}"
            done
            {
              echo '## clippy output (last 120 lines)'
              echo '```'
              tail -120 /tmp/clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: tests
        run: cargo test --workspace

  build-macos:
    name: Release build (Mac mini)
    # Self-hosted runner — NEVER widen this condition to pull_request:
    # fork PRs must not execute code on private hardware.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build release bundle
        run: npm ci && npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NaVinaMP-macos-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 14
          if-no-files-found: error
