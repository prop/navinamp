name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (ubuntu)
    # Pinned: ubuntu-latest moved to Ubuntu 26 (2026-10-19) whose package set
    # breaks Tauri's system deps; stay on 24.04 until they're verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          # NB: the default shell is `bash -e`; drop errexit around the
          # pipeline so the failure path below actually runs.
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the log tail as annotations (publicly readable via
            # the API — logs require sign-in). Whatever stopped the build,
            # its last words end up here.
            grep -v '^\s*$' /tmp/clippy.log | tail -10 | while IFS= read -r line; do
              echo "::error::${line:0:220}"
            done
          fi
          exit "$status"

      - name: tests
        run: cargo test --workspace

  build-macos:
    name: Release build (Mac mini)
    # Self-hosted runner — NEVER widen this condition to pull_request:
    # fork PRs must not execute code on private hardware.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare App Store Connect API key (if configured)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$HOME/.navinamp-signing"
            printf '%s' "$APPLE_API_KEY_P8" > "$HOME/.navinamp-signing/AuthKey_NaVinaMP.p8"
            echo "APPLE_API_KEY_PATH=$HOME/.navinamp-signing/AuthKey_NaVinaMP.p8" >> "$GITHUB_ENV"
          else
            echo "no notarization key configured — build stays ad-hoc signed"
          fi

      - name: Build release bundle
        env:
          # When these secrets exist, the Tauri CLI signs (Developer ID),
          # notarizes and staples automatically. Without them the build is
          # ad-hoc signed (Gatekeeper prompts on other machines).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          # Alternative simpler notarization path (choose either):
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npm ci && npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NaVinaMP-macos-${{ github.sha }}
          # NB: cargo WORKSPACE — the bundle lives under the root target/,
          # not src-tauri/target/.
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          retention-days: 14
          if-no-files-found: error
