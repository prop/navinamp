<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="NaVinaMP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b20"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1e6ea"/>
      <stop offset="1" stop-color="#9aa4ad"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c46b7c"/>
      <stop offset="1" stop-color="#743044"/>
    </linearGradient>
    <radialGradient id="glow" cx=".38" cy=".24" r=".95">
      <stop offset="0" stop-color="#242b32"/>
      <stop offset="1" stop-color="#0b0e12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- abstract NaVinaMP monogram: silver N whose right stroke pours into wine -->
  <g fill="none" stroke="url(#stem)" stroke-width="64" stroke-linecap="round">
    <path d="M348 286v370"/>
    <path d="M662 286v292"/>
    <path d="M348 298 662 636"/>
  </g>

  <!-- wine drop terminal -->
  <path d="M662 586c34 43 68 79 68 124a68 68 0 0 1-136 0c0-45 34-81 68-124z"
        fill="url(#wine)"/>
  <ellipse cx="638" cy="662" rx="16" ry="24" fill="#ffffff" opacity=".16"
           transform="rotate(-22 638 662)"/>
</svg>
