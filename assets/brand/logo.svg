<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="NaVinaMP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181d22"/>
      <stop offset="1" stop-color="#0b0e11"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4485e"/>
      <stop offset="1" stop-color="#6d1e33"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8ec"/>
      <stop offset="1" stop-color="#99a3ac"/>
    </linearGradient>
    <radialGradient id="glow" cx=".38" cy=".24" r=".95">
      <stop offset="0" stop-color="#212830"/>
      <stop offset="1" stop-color="#0a0d10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- wine glass -->
  <path d="M298 206h428c0 154-94 266-214 266s-214-112-214-266z"
        fill="#161b20" stroke="url(#metal)" stroke-width="28" stroke-linejoin="round"/>
  <path d="M330 274h364c0 118-82 162-182 162s-182-44-182-162z" fill="url(#wine)"/>

  <!-- wine waveform -->
  <path d="M366 362c32-28 64-28 96 0s64 28 96 0 64-28 96 0 32 28 64 0"
        fill="none" stroke="#e9edf0" stroke-width="22" stroke-linecap="round"/>

  <!-- stem and base -->
  <path d="M490 472h44v158h-44z" fill="url(#metal)"/>
  <path d="M358 630h308c20 0 36 16 36 36s-16 36-36 36H358c-20 0-36-16-36-36s16-36 36-36z"
        fill="url(#metal)"/>

  <!-- glass shine -->
  <path d="M347 250c6-10 20-11 28-1l54 63c14 16 0 34-19 27-38-14-66-49-63-89z"
        fill="#ffffff" opacity=".10"/>
</svg>
