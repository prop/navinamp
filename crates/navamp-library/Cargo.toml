[package]
name = "navamp-library"
version.workspace = true
edition.workspace = true
description = "NavAmp music library: incremental SQLite/FTS5 scanner + queries"
license = "MIT"

[dependencies]
lofty = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
walkdir = "2"

[dev-dependencies]
serde_json = "1"
