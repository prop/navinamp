[package]
name = "navamp-audio"
version.workspace = true
edition.workspace = true
description = "NavAmp audio engine: symphonia decode -> DSP -> lock-free ring buffer -> cpal output"
license = "MIT"

[dependencies]
# Container + codec support. Note: symphonia 0.5/0.6 has no released Opus decoder
# (the `ogg` feature still enables the Ogg container, e.g. for Vorbis).
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
cpal = "0.18"
rubato = "5.0"
crossbeam-channel = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Tag reading (ReplayGain) at track open. Same version the library crate
# pins, so the tree carries exactly one lofty.
lofty = "0.25"
# FFT for the spectrum analyser. Already in the lockfile (realfft, via
# rubato), so this adds no new tree weight.
rustfft = "6"
# Remote (HTTP) media sources for Navidrome streaming (M5). rustls, not
# native-tls, to keep the build free of OpenSSL; `blocking` because the
# producer thread is a plain synchronous decoder loop. The only non-dev
# network dependency in the crate; see `src/http_stream.rs`.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }

[dev-dependencies]
ctrlc = "3"
crossbeam-channel = "0.5"
