[package]
name = "navinamp-llm"
version.workspace = true
edition.workspace = true
description = "Minimal chat-completion client for NaVinaMP's AI search (OpenAI-compatible providers + Anthropic)"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
wiremock = "0.6.5"
