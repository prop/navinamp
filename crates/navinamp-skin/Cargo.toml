[package]
name = "navinamp-skin"
version.workspace = true
edition.workspace = true
description = "NaVinaMP Wasabi skin engine: .wal archive loading, skin.xml parsing into a normalized model, and bitmap payloads (PNG data-URLs)"

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
quick-xml = "0.42.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate", "bzip2", "time"] }
