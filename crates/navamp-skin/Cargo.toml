[package]
name = "navamp-skin"
version.workspace = true
edition.workspace = true
description = "NavAmp Wasabi skin engine: .wal archive loading + skin.xml parsing into a normalized model"

[dependencies]
quick-xml = "0.42.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate", "bzip2", "time"] }
